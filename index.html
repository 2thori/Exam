
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCENE · Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍿</text></svg>"
</head>
<body>
  <!-- ========== TOP BAR ========== -->
  <header class="topbar">
  <div class="topbar__logo">
    <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <circle cx="12" cy="12" r="4"></circle>
      <line x1="4.93" y1="4.93" x2="9.17" y2="9.17"></line>
      <line x1="14.83" y1="14.83" x2="19.07" y2="19.07"></line>
      <line x1="14.83" y1="9.17" x2="19.07" y2="4.93"></line>
      <line x1="9.17" y1="14.83" x2="4.93" y2="19.07"></line>
    </svg>
    SCENE<span class="topbar__dot">.</span>
  </div>
</header>

  <!-- ========== SIDEBAR ========== -->
  <nav class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar__item sidebar__item--active" data-page="home">
  <svg class="sidebar__icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
    <polyline points="9 22 9 12 15 12 15 22"></polyline>
  </svg>
  <span class="sidebar__label">Home</span>
</a>
    <a href="#" class="sidebar__item" data-page="profile">
  <svg class="sidebar__icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
    <circle cx="12" cy="7" r="4"></circle>
  </svg>
  <span class="sidebar__label">Profile</span>
</a>
    <a href="explore.html" class="sidebar__item" data-page="explore">
  <svg class="sidebar__icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
  <span class="sidebar__label">Explore</span>
</a>
    <button class="sidebar__item" id="watchTogetherBtn" data-page="together">
  <svg class="sidebar__icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
    <circle cx="9" cy="7" r="4"></circle>
    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
  </svg>
  <span class="sidebar__label">Watch Together</span>
</button>
  </nav>

  <!-- ========== MAIN ========== -->
  <main class="main">
    <!-- Hero -->
    <section class="hero" id="hero">
      <div class="hero__backdrop" id="heroBackdrop"></div>
      <div class="hero__overlay"></div>
      <div class="hero__content">
        <h1 class="hero__title" id="heroTitle">Loading…</h1>
        <p class="hero__desc" id="heroDesc"></p>
        <div class="hero__buttons">
          <button class="btn btn--primary" id="heroPlay">▶ PLAY NOW</button>
          <a class="btn btn--secondary" id="heroMore" href="#">MORE INFO</a>
        </div>
      </div>
    </section>

    <!-- Search -->
    <section class="search-section">
      <input
        type="text"
        class="search-bar"
        id="homeSearch"
        placeholder="Search movies, shows, documentaries..."
        aria-label="Search"
      />
    </section>

    <!-- Learn something new -->
    <section class="row-section" id="documentariesSection">
      <h2 class="section-title">Learn something new</h2>
      <div class="row-scroll" id="documentariesRow">
        <div class="skeleton-row">
          <div class="skeleton-card"></div><div class="skeleton-card"></div>
          <div class="skeleton-card"></div><div class="skeleton-card"></div>
        </div>
      </div>
    </section>

    <!-- Trending Now -->
    <section class="row-section" id="trendingSection">
      <h2 class="section-title">Trending Now</h2>
      <div class="row-scroll" id="trendingRow">
        <div class="skeleton-row">
          <div class="skeleton-card"></div><div class="skeleton-card"></div>
          <div class="skeleton-card"></div><div class="skeleton-card"></div>
        </div>
      </div>
    </section>

    <!-- Top Rated -->
    <section class="row-section" id="topRatedSection">
      <h2 class="section-title">Top Rated</h2>
      <div class="row-scroll" id="topRatedRow">
        <div class="skeleton-row">
          <div class="skeleton-card"></div><div class="skeleton-card"></div>
          <div class="skeleton-card"></div><div class="skeleton-card"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- ========== WATCH TOGETHER MODAL ========== -->
  <div class="modal-overlay" id="watchTogetherModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="wtTitle">
      <button class="modal__close" id="wtClose">✕</button>
      <h2 class="modal__title" id="wtTitle">Watch Together</h2>
      <p class="modal__subtitle">Watch your favourite movie with your friends</p>
      <div class="wt-boxes">
        <div class="wt-box">
          <h3 class="wt-box__title">Create a room</h3>
          <button class="btn btn--primary" id="wtCreateBtn">Generate code</button>
          <div class="wt-code" id="wtCode" hidden>
            <span class="wt-code__value" id="wtCodeValue"></span>
            <button class="btn btn--secondary" id="wtCopyBtn">Copy code</button>
          </div>
        </div>
        <div class="wt-box">
          <h3 class="wt-box__title">Join a room</h3>
          <input type="text" class="wt-input" id="wtJoinInput" maxlength="6" placeholder="Enter code" />
          <button class="btn btn--primary" id="wtJoinBtn">Join</button>
        </div>
      </div>
      <p class="wt-message" id="wtMessage" hidden></p>
    </div>
  </div>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <p>SCENE · Made with 🎬 and TMDB</p>
  </footer>

  <!-- Modules -->
  <script type="module" src="./js/home.js"></script>
</body>
</html>
